function calcIdx(ansArr){
var raw={"甲":0,"乙":0,"丙":0,"丁":0,"戊":0,"己":0,"庚":0};
QS.forEach(function(q,i){
var oi=ansArr[i];
if(oi>=0&&q.o[oi]){raw[q.o[oi][1]]+=3;}
});
var idx={};
TY.forEach(function(k){idx[k]=raw[k]/CNT[k];});
return {raw:raw,idx:idx};
}
function pickTop(idx){
return TY.slice().sort(function(a,b){
if(idx[b]!==idx[a])return idx[b]-idx[a];
return CNT[a]-CNT[b];
});
}

'<div class="two" id="twoRow"><button class="ghost" id="swapBtn">'+(st.swapped?"已换过一次":"换 一 个")+'</button><button class="ghost" id="copyBtn">抄 一 份</button></div>'+
'<button id="againBtn">重 新 作 答</button>'+
'<div class="fine" id="footTip">右下角那一角翻起来，背面还有东西。</div>';
el("res").scrollTop=0;
st.taps=0;
}
el("res").addEventListener("click",function(e){
var bar=e.target.closest(".barrow");
if(bar){
var k=bar.getAttribute("data-k");
var tip=el("barTip");
if(tip)tip.textContent=STARC[k];
return;
}
if(e.target.closest("#sealBtn")){
if(st.stamped){
el("sealTip").textContent="此票已生效。印只有一方，盖过一次就不再盖了。";
return;
}
st.stamped=true;
el("sealBtn").classList.add("stamped");
el("sealTip").textContent="此票已生效。";
return;
}
if(e.target.closest("#copyBtn")){
var box=el("copyBox");
if(!box){
el("twoRow").insertAdjacentHTML("afterend",
'<div class="copybox" id="copyBox"><div class="ct">抄 件</div>'+
'<textarea id="copyText" readonly></textarea>'+
'<div class="two"><button class="ghost" id="copyDo">复制这段</button><button class="ghost" id="copyClose">收起</button></div>'+
'<div class="fine" id="copyTip" style="margin-top:6px;"></div></div>');
}
el("copyText").value=buildCopy();
el("copyTip").textContent="文字已列在上头。点「复制这段」若不成，您长按框里全选，自己抄走也一样。";
el("copyBox").scrollIntoView({block:"center"});
return;
}
if(e.target.closest("#copyDo")){
var tx=el("copyText");
if(!tx)return;
var ok=false;
try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(tx.value);ok=true;}}catch(err){ok=false;}
if(!ok){
tx.removeAttribute("readonly");
tx.focus();
tx.select();
try{document.execCommand("copy");ok=true;}catch(err2){ok=false;}
tx.setAttribute("readonly","readonly");
}
el("copyTip").textContent=ok?"已抄好一份。拿去贴吧——只是别把我的名字写错。":"这台机器不让我抄。您长按框里，全选之后手动复制也成。";
return;
}
if(e.target.closest("#copyClose")){
var b2=el("copyBox");
if(b2)b2.remove();
return;
}
if(e.target.closest("#swapYes")){st.swapped=true;result(true);return;}
if(e.target.closest("#swapNo")){var n=el("swapConfirm");if(n)n.remove();return;}
if(e.target.closest("#swapBtn")){
if(st.swapped){alert("只此一次。说过的话我不会改，主。");return;}
if(el("swapConfirm"))return;
el("twoRow").insertAdjacentHTML("beforebegin",
'<div class="egg" id="swapConfirm">换一个？……好吧。<br>话我说在前头：这另一个给您，是看在您开口的份上。按下去，票面上的名字就真的改了。<br>只此一次。<div class="two" style="margin-top:10px;"><button class="ghost" id="swapYes">那就换</button><button id="swapNo">不换了</button></div></div>');
return;
}
if(e.target.closest("#againBtn")){
st=fresh();
el("resScreen").classList.add("hide");
el("quizScreen").classList.remove("hide");
build();upd();
return;
}
if(e.target.closest("#resName")){
st.taps++;
if(st.taps>=3&&!document.getElementById("secretLine")){
var d=document.createElement("div");
d.id="secretLine";
d.className="egg";
d.textContent="（此栏本不载于票面。您既已翻到——七系之中无论何者，一旦为您所择，皆将化为同一桩麻烦：只认一人，其余作废。）";
el("res").appendChild(d);
}
}
});
el("fold").addEventListener("click",function(){
var B=BACK[st.topKey]||BACK["甲"];
el("ticket").innerHTML=
'<div class="tk">票 根 · 背 书</div>'+
'<div class="tl">'+B.l+'</div>'+
'<div class="tp">'+B.p+'</div>'+
'<div class="td">'+today()+'<br>压切长谷部</div>'+
'<button id="ticketClose">放 回 原 处</button>';
el("backNote").classList.add("on");
});
el("backNote").addEventListener("click",function(e){
if(e.target.closest("#ticketClose")||e.target.id==="backNote"){el("backNote").classList.remove("on");}
});
el("cvTitle").addEventListener("click",function(){
st.taps++;
if(st.taps>=5&&!el("cvEgg").classList.contains("on")){
el("cvEgg").textContent="点这么多回做什么。我又不会因为您多点几下就变得更好挑。";
el("cvEgg").classList.add("on");
}
});
el("startBtn").addEventListener("click",function(){
el("coverScreen").classList.add("hide");
el("quizScreen").classList.remove("hide");
build();upd();
});
(function initCover(){
var c=getCount();
if(c>0){
el("cvCount").textContent="您已作过 "+c+" 回。"+(c>=4?"前几回的判定不一样，我不说，您自己知道。":"");
}
})();
build();upd();
</script>
</body>
</html>
